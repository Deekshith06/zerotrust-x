[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zerotrust-x"
version = "0.1.0"
description = "Deterministic multi-source security telemetry foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "polars>=1.0", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["httpx2>=0.1", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]
ingest = ["openpyxl>=3.1", "pyarrow>=17.0"]

[project.scripts]
zerotrust-x = "zerotrust_x.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "src.zerotrust_x.web:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
extend-exclude = ["scripts"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
